services:
  cowrie:
    image: cowrie/cowrie:latest
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - ./cowrie-data:/home/cowrie/cowrie-git/var
    restart: unless-stopped
  payload:
    # Serves attack1.sh's Phase 3 payload (and receives Phase 13's exfil
    # POST) from a container on the SAME docker-compose network as cowrie,
    # reachable by the service name "payload" via Docker's built-in DNS.
    # This replaces guessing/probing host bridge-gateway IPs (172.18.0.1,
    # 172.17.0.1, ...) from inside the cowrie container, which depends on
    # host firewall/iptables rules that vary by machine and were the actual
    # cause of Phase 3 being skipped — container-to-container DNS on a
    # user-defined bridge network works regardless of host firewall state.
    image: python:3.12-alpine
    working_dir: /srv
    volumes:
      - ./payload:/srv
    command: ["python3", "payload_server.py"]
    restart: unless-stopped
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
  kibana:
    image: docker.elastic.co/kibana/kibana:8.5.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    restart: unless-stopped
volumes:
  es_data:
